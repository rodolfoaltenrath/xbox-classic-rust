# Workspace do emulador — ver ROADMAP.md §6 (estrutura) e §13 (convenções de build).
#
# Licença: Apache-2.0 (ADR-0007). Todos os crates são `publish = false`.

[workspace]
members  = ["crates/*", "apps/*", "tools/*"]
exclude  = ["crates/xbox-formats/fuzz", "crates/xbox-core/bench"]
resolver = "3"

[workspace.package]
version      = "0.0.1"
edition      = "2024"
rust-version = "1.98"
publish      = false
license      = "Apache-2.0"

[workspace.dependencies]
# Núcleo
xbox-core     = { path = "crates/xbox-core" }
xbox-formats  = { path = "crates/xbox-formats" }
xbox-mem      = { path = "crates/xbox-mem" }
xbox-cpu      = { path = "crates/xbox-cpu" }
xbox-recomp   = { path = "crates/xbox-recomp" }
xbox-kernel   = { path = "crates/xbox-kernel" }
xbox-gpu      = { path = "crates/xbox-gpu" }
xbox-audio    = { path = "crates/xbox-audio" }
xbox-input    = { path = "crates/xbox-input" }
xbox-platform = { path = "crates/xbox-platform" }
xbox-ui       = { path = "crates/xbox-ui" }
xbox-dbg      = { path = "crates/xbox-dbg" }

# Terceiros — registrar licença em docs/dev/third-party.md (ROADMAP §14)
thiserror = "2"
tracing   = "0.1"
serde     = { version = "1", features = ["derive"] }
toml      = "0.8"
iced-x86  = { version = "1.21.0", default-features = false, features = ["std", "decoder", "instr_info"] }

# `ansi`/`color` desligados de propósito: puxam `windows-sys`, que exige um MinGW
# completo neste host (ver ADR-0008 e docs/dev/build.md), e o modo appliance da Fase 10
# não tem terminal nenhum. Reativar quando o host tiver toolchain MSVC.
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt", "std", "registry", "env-filter", "smallvec", "tracing-log",
] }
clap = { version = "4", default-features = false, features = [
    "std", "derive", "help", "usage", "error-context", "suggestions",
] }


# ─── Perfis (ROADMAP §13.1) ────────────────────────────────────────────────────

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
strip         = true
debug         = false
# panic: mantido em "unwind" — o fastmem (ADR-0005) depende de recuperação de fault.
# Reavaliar "abort" na Fase 10 com medição. ROADMAP §13.1.

[profile.release-dbg]
inherits = "release"
debug    = true
strip    = false
lto      = "thin"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# ─── Lints de workspace (ROADMAP §13.3) ────────────────────────────────────────

[workspace.lints.rust]
unsafe_code            = "deny"   # crates autorizados usam #![allow(unsafe_code)] + // SAFETY:
missing_debug_implementations = "warn"
rust_2018_idioms       = { level = "warn", priority = -1 }
unreachable_pub        = "warn"

[workspace.lints.clippy]
all          = { level = "warn", priority = -1 }
pedantic     = { level = "warn", priority = -1 }
# Ruído sem valor para este projeto:
module_name_repetitions = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
cast_possible_truncation = "allow"  # emulação é cheia de truncamento intencional
cast_lossless            = "allow"
unreadable_literal       = "allow"  # endereços de hardware
must_use_candidate       = "allow"  # 90% dos getters do emulador cairiam nisso
