# CI da Fase 0 (ROADMAP §9): fmt, clippy, teste e build release nos dois sistemas.
#
# Os runners do GitHub usam o toolchain MSVC no Windows, então aqui o `windows-sys`
# linka normalmente e o pacote de benchmarks pode ser compilado (ver ADR-0008).

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: never
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: formatação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: testes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets --features xbox-cpu/isa-oracle
      - name: doctests
        run: cargo test --workspace --doc

  release:
    name: build release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release
      - name: doctor roda
        run: cargo run --release -p obsidian -- doctor

  bench-compila:
    name: benchmarks compilam
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # Só compila; medir em CI não dá número confiável (ROADMAP §10 pede medição local).
      - run: cargo bench --no-run
        working-directory: crates/xbox-core/bench

  memory-miri:
    name: contrato de memória sob Miri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly-2026-10-20 --profile minimal --component miri,rust-src
      - run: cargo +nightly-2026-10-20 miri setup
      - run: cargo +nightly-2026-10-20 miri test -p xbox-mem --test contract
