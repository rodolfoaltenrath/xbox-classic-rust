[package]
name = "xbox-core"
description = "Tipos base, relogio virtual, snapshots, configuracao e logging compartilhados"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }

[features]
default = []
## RAM de 128 MB (dev kit) em vez dos 64 MB do console retail.
ram128 = []
## Tracing de alta granularidade; tem custo mesmo desligado em runtime.
trace-verbose = []

# Benchmarks vivem em ./bench (pacote separado, fora do workspace) — ver ADR-0008.

[lints]
workspace = true
